when:
  event: [push, manual]

# All steps in a pipeline share one workspace volume (local-path storage,
# which is node-local — it binds to whichever node first mounts it). Since
# every other step here is pinned to arm64, the clone step must be too, or
# the workspace volume binds to the default amd64 node and no later step
# can ever mount it.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: dedicated
            operator: Equal
            value: pi
            effect: NoSchedule

steps:
  build-test:
    image: docker.io/woodpeckerci/plugin-kaniko:latest@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    settings:
      repo: graph-hdmi-switch-test
      registry: registry.morrisons.site
      dockerfile: Dockerfile
      target: test
      tags: ${CI_COMMIT_SHA}
      username: ci
      password:
        from_secret: zot_password
    # Dockerfile's base images are pinned to arm64 digests (this deploys to
    # pi5-8, a Raspberry Pi). Kaniko can't cross-build/emulate, so the build
    # itself must run natively on an arm64 node, not the default amd64 one.
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: dedicated
            operator: Equal
            value: pi
            effect: NoSchedule

  test:
    image: registry.morrisons.site/graph-hdmi-switch-test:${CI_COMMIT_SHA}
    commands:
      - uv run pytest
    # This image only contains arm64 binaries — must run on an arm64 node.
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: dedicated
            operator: Equal
            value: pi
            effect: NoSchedule

  build-release:
    image: docker.io/woodpeckerci/plugin-kaniko:latest@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    settings:
      repo: graph-hdmi-switch
      registry: registry.morrisons.site
      dockerfile: Dockerfile
      target: release
      tags: ${CI_COMMIT_SHA}
      build_args:
        - COMMIT_SHA=${CI_COMMIT_SHA}
      username: ci
      password:
        from_secret: zot_password
    when:
      branch: main
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: dedicated
            operator: Equal
            value: pi
            effect: NoSchedule

  verify-deploy:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - sh scripts/verify-deploy.sh
    when:
      branch: main
    # Reads scripts/verify-deploy.sh from the shared workspace volume, which
    # is arm64-pinned (see the clone step above) — must match to mount it.
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: dedicated
            operator: Equal
            value: pi
            effect: NoSchedule

  notify-discord:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - apk add --no-cache curl
      - >
        curl -sf -H "Content-Type: application/json" -X POST
        -d "{\"content\": \"🔴 **${CI_REPO}** build failed — pipeline #${CI_PIPELINE_NUMBER}, commit ${CI_COMMIT_SHA}\\n${CI_PIPELINE_URL}\"}"
        "$DISCORD_WEBHOOK_URL"
    when:
      status: [failure]
