name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: k8s-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sync this repo's Discord webhook URL from admin-discord's state
        uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@dd571a54df253c5922807a444b3a45cc0b76b49f # main
      - id: read_discord_webhook
        uses: mattjmorrison-homelab/actions-tofu/read-output@dd571a54df253c5922807a444b3a45cc0b76b49f # main
        with:
          state-key: admin-discord/terraform.tfstate
          output-name: webhook_urls
          map-key: github-actions
      - uses: mattjmorrison-homelab/actions-openbao/write-secret@0fe1624c376515aee139cc58ac8328d9921e21dd # main
        with:
          role: graph-hdmi-switch-discord
          kv-path: homelab/graph-hdmi-switch/discord-webhook-url
          value: ${{ steps.read_discord_webhook.outputs.value }}

      - name: Build and push the test-stage image
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: graph-hdmi-switch-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/graph-hdmi-switch.git#refs/heads/main
            --dockerfile=Dockerfile --skip-unused-stages=true --target=test --destination=registry.morrisons.site/graph-hdmi-switch-test:${{ github.sha }}
          secret-volume: zot-pull-secret:/kaniko/.docker
          node-selector: kubernetes.io/arch=arm64
          tolerations: dedicated=pi:NoSchedule
          active-deadline-seconds: "1800"

      - name: Run tests inside the just-built test image
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: graph-hdmi-switch-job
          image: registry.morrisons.site/graph-hdmi-switch-test:${{ github.sha }}
          command: uv run pytest
          node-selector: kubernetes.io/arch=arm64
          tolerations: dedicated=pi:NoSchedule

      - name: Build and push the release image
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: graph-hdmi-switch-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/graph-hdmi-switch.git#refs/heads/main
            --dockerfile=Dockerfile --skip-unused-stages=true --target=release --build-arg=COMMIT_SHA=${{ github.sha }}
            --destination=registry.morrisons.site/graph-hdmi-switch:${{ github.sha }}
          secret-volume: zot-pull-secret:/kaniko/.docker
          node-selector: kubernetes.io/arch=arm64
          tolerations: dedicated=pi:NoSchedule
          active-deadline-seconds: "1800"

      - run: sh scripts/verify-deploy.sh
        env:
          CI_COMMIT_SHA: ${{ github.sha }}

      - name: Notify Discord on failure
        if: failure()
        uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: graph-hdmi-switch-discord
          kv-path: homelab/graph-hdmi-switch/discord-webhook-url
          output-name: DISCORD_WEBHOOK_URL
      - if: failure()
        run: >-
          curl -sf -H "Content-Type: application/json" -X POST
          -d "{\"content\": \"🔴 **graph-hdmi-switch** build failed — ${{ github.sha }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          "$DISCORD_WEBHOOK_URL"
